name: Android APK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # crear el Release y adjuntar el APK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # El nombre de la ref va por env y entrecomillado: interpolar ${{ }} dentro
      # de un run: deja que un tag o rama con nombre malicioso ejecute comandos.
      - name: Build APK
        env:
          TAG: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: gradle -p android assembleDebug --no-daemon -Pvname="$TAG" -Pvcode="$RUN"

      - uses: actions/upload-artifact@v4
        with:
          name: descanso-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Notas del release desde el CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '
            /^## / { if (found) exit; if ($2 == tag) found = 1; next }
            found
          ' CHANGELOG.md > NOTAS.md
          cat NOTAS.md

      # Acción de terceros con permiso de escritura: se fija al SHA, no al tag
      # v2, que su autor puede mover a cualquier commit en cualquier momento.
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: NOTAS.md
          files: android/app/build/outputs/apk/debug/app-debug.apk
